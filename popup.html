<!doctype html><html><head><meta charset="utf-8"><title>Nobotty</title>
<style>
body{margin:0;width:300px;font:14px/1.45 system-ui,-apple-system,sans-serif;color:#10231a;background:#f4f6ef}
.w{padding:16px}h1{font-size:18px;margin:0 0 4px;letter-spacing:-.01em}p{margin:0 0 12px;color:#44584c;font-size:13px}
label{display:flex;gap:10px;align-items:flex-start;padding:8px 0;border-top:1px solid #d5ddcf;cursor:pointer}
input[type=checkbox]{margin-top:3px;accent-color:#e8693f}
small{color:#5a6d60;display:block}
.t{margin-top:10px}textarea{width:100%;height:56px;box-sizing:border-box;font:13px system-ui;border:1px solid #cdd7c8;border-radius:10px;padding:8px;background:#fbfcf8}
button{margin-top:8px;width:100%;padding:10px;border:0;border-radius:999px;background:#e8693f;color:#10231a;font-weight:600;cursor:pointer;transition:transform 160ms cubic-bezier(.23,1,.32,1)}
button:active{transform:scale(.97)}
</style></head><body><div class="w">
<h1>Nobotty</h1><p>Hints about likely bot and brand-new accounts. Signals, not proof. Runs on your device only.</p>
<label><input type="checkbox" id="enabled"><span>Turn on<small>Check comments on Reddit</small></span></label>
<label><input type="checkbox" id="collapseHigh"><span>Collapse strong signals<small>One click on the label shows the comment</small></span></label>
<label><input type="checkbox" id="showMedium"><span>Mark medium signals<small>Slightly dimmed, with a label</small></span></label>
<div class="t" style="margin-bottom:6px"><b>Direct messages</b></div>
<label><input type="checkbox" id="dmFilter"><span>Filter direct messages<small>Hide scam and bot messages</small></span></label>
<label><input type="checkbox" id="dmBlockBots"><span>Hide bots and scams<small>Crypto, "add me on Telegram", new accounts with links</small></span></label>
<label><input type="checkbox" id="dmBlockSellers"><span>Hide sales pitches too<small>Turn off if you want offers from sellers. Only bots and scams are hidden then.</small></span></label>
<div class="t"><b>Trusted accounts</b><small>One username per line. These are never marked.</small>
<textarea id="trusted" spellcheck="false"></textarea><button id="save">Save</button></div>
</div><script src="popup.js"></script></body></html>
